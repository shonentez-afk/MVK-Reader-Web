name: MVK IDR Bridge - Static QA
on:
  push:
    branches:
      - 'feature/mvk-idr-bridge-*'
    paths:
      - 'tools/mvk_idr_bridge/**'
      - '.github/workflows/mvk-idr-bridge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests - no original EXE required
        run: python -m unittest discover -s tools/mvk_idr_bridge/tests -v