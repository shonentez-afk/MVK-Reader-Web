name: MVKView Windows candidate with offline FIR and seek fixes

on:
  push:
    branches: ['qa/stage111-windows-fir-seek-54b749e']
    paths: ['.github/workflows/stage111-windows-fir-seek-54b749e.yml']

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref == 'refs/heads/qa/stage111-windows-fir-seek-54b749e'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: '${{ github.sha }}'
      SOURCE_BRANCH: 'qa/stage111-windows-fir-seek-54b749e'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Checkout exact candidate source SHA
        uses: actions/checkout@v6
        with:
          ref: '${{ github.sha }}'
          path: source
          persist-credentials: false
      - name: Verify exact clean source checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw "Source SHA mismatch: $head" }
          $status = git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Source checkout is not clean' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false
      - name: Stage a verified offline FIR build resource
        env:
          MVK_FIR_BANK_B64: ${{ secrets.MVK_FIR_BANK_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MVK_FIR_BANK_B64) { throw 'Required Actions secret MVK_FIR_BANK_B64 is missing' }
          $fir = Join-Path $env:RUNNER_TEMP 'offline_fir.bin'
          [IO.File]::WriteAllBytes($fir, [Convert]::FromBase64String($env:MVK_FIR_BANK_B64))
          $expected = (Select-String -Path mvk_compatible/core/bundled_offline_fir.py -Pattern '^_PACKAGED_SHA256 = "([0-9a-f]{64})"$').Matches[0].Groups[1].Value
          if ((Get-Item -LiteralPath $fir).Length -ne 20480 -or (Get-FileHash -LiteralPath $fir -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            Remove-Item -LiteralPath $fir -Force
            throw 'Offline FIR resource failed integrity verification'
          }
          "OFFLINE_FIR_FILE=$fir" >> $env:GITHUB_ENV
      - name: Install declared application dependencies, PyInstaller and pytest
        run: |
          python -m pip install -r mvk_compatible/requirements-desktop.txt pyinstaller pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Qt offline smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q mvk_compatible/tests/test_desktop_qt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reopen synthetic saved ADC and Byte TACH BIN on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q `
            mvk_compatible/tests/test_stage111z16_direct_bin_tsxml.py `
            mvk_compatible/tests/test_stage111z31o_direct_bin_gui_e2e.py `
            mvk_compatible/tests/test_stage111z31cy_native_tach_evidence.py `
            mvk_compatible/tests/test_stage111z31cy_qt_tach_file_and_status.py `
            mvk_compatible/tests/test_stage111z31en_saved_tach.py `
            mvk_compatible/tests/test_stage111z31en_saved_tach_qt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify saved Mode1 scale, timeline, range, and report locale
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q mvk_compatible/tests/test_mode1_parity_offline_view.py mvk_compatible/tests/test_stage111z31bv_adc_spectrum_actions_core.py mvk_compatible/tests/test_stage111z31bv_qt_original_adc_spec_actions.py mvk_compatible/tests/test_stage111z31bw_qt_adc_source_view.py mvk_compatible/tests/test_mode1_saved_adc_spectrum_export_qt.py mvk_compatible/tests/test_stage111z31el_live_epoch_qt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify prerelease audit regressions before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q `
            mvk_compatible/tests/test_live_values_multiple_descriptors.py `
            mvk_compatible/tests/test_mode2_live_values_full_chain.py `
            mvk_compatible/tests/test_mode1_graph_audit_fixes_qt.py `
            mvk_compatible/tests/test_mode24_56_pageconfig_parity_qt.py `
            mvk_compatible/tests/test_prerelease_pagefile_persistence_qt.py `
            mvk_compatible/tests/test_stage111z31ce_qt_live_grid_wave_xor.py `
            mvk_compatible/tests/test_stage111z31ee_writer_names_octave_factory.py `
            mvk_compatible/tests/test_stage111z31bt_qt_pagecalib_original.py `
            mvk_compatible/tests/test_stage111z31bg_qt_windowman_form.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify new operator acceptance regressions before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q `
            mvk_compatible/tests/test_operator_first_acceptance_fixes.py `
            mvk_compatible/tests/test_stage111z31bu_qt_page_start_status.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and embed the project Go payload
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path (Get-Location) 'mvk_compatible/native_payload'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'MVK_Native_R6_1_Stage108_Windows_x64.exe'
          Push-Location tools/research/native_tcp10230_stage108_live_recording_r6_1/source
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go vet ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go build -trimpath -ldflags '-s -w' -o $exe .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -Encoding ascii -LiteralPath (Join-Path $dir 'NATIVE_SHA256SUMS.txt')
      - name: Verify offline FIR loader and filter matrix
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q mvk_compatible/tests/test_packaged_offline_fir.py mvk_compatible/tests/test_stage111z31eg_full_fir_matrix.py mvk_compatible/tests/test_offline_fir_seek_regressions_qt.py
      - name: Package unofficial candidate and launch it offline
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'MVKViewCompatible_Stage111_UNOFFICIAL_FIR_SEEK_CANDIDATE'
          $tmp = Join-Path $env:RUNNER_TEMP 'mvk-candidate-3bb9b72-smoke'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --add-binary 'mvk_compatible/native_payload/MVK_Native_R6_1_Stage108_Windows_x64.exe;mvk_native' --add-data 'mvk_compatible/native_payload/NATIVE_SHA256SUMS.txt;mvk_native' --add-data "$env:OFFLINE_FIR_FILE;mvk_fir" --name $name mvk_compatible/windows_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = (Resolve-Path "dist/$name.exe").Path
          $probe = Start-Process -FilePath $app -ArgumentList '--verify-offline-fir' -PassThru
          if (-not $probe.WaitForExit(90000)) { taskkill /PID $probe.Id /T /F | Out-Null; throw 'Packaged FIR self-check timed out' }
          if ($probe.ExitCode -ne 0) { throw 'Packaged FIR self-check failed' }
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($app))
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Missing MZ header' }
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'Not a Windows x64 PE' }
          } finally { $reader.Dispose() }
          $oldTemp = $env:TEMP
          $oldTmp = $env:TMP
          $env:TEMP = $tmp
          $env:TMP = $tmp
          try { $proc = Start-Process -FilePath $app -PassThru }
          finally { $env:TEMP = $oldTemp; $env:TMP = $oldTmp }
          try {
            $nativeName = 'MVK_Native_R6_1_Stage108_Windows_x64.exe'
            $embedded = $null
            for ($i = 0; $i -lt 90 -and -not $embedded; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "Candidate exited during startup: $($proc.ExitCode)" }
              $embedded = Get-ChildItem -LiteralPath $tmp -Filter $nativeName -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $embedded) { Start-Sleep -Seconds 1 }
            }
            if (-not $embedded) { throw 'Packed Go payload was not extracted' }
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) { throw "Candidate exited after unpacking: $($proc.ExitCode)" }
            $expected = (Get-Content -Raw -LiteralPath 'mvk_compatible/native_payload/NATIVE_SHA256SUMS.txt').Trim()
            if ((Get-FileHash -LiteralPath $embedded.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Packed Go payload SHA256 mismatch' }
          } finally {
            if (-not $proc.HasExited) { taskkill /PID $proc.Id /T /F | Out-Null }
          }
          $path = Join-Path $env:GITHUB_WORKSPACE 'candidate-output'
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          $copy = Join-Path $path "$name.exe"
          Copy-Item -LiteralPath $app -Destination $copy
          $hash = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Artifact copy mismatch' }
          "$hash  $name.exe" | Set-Content -Encoding ascii -LiteralPath (Join-Path $path 'SHA256SUMS.txt')
          @(
            'label=UNOFFICIAL_REVIEW_CANDIDATE (not official Windows Preview)'
            "source_commit=$env:SOURCE_SHA"
            "source_branch_label_at_pin=$env:SOURCE_BRANCH"
            "runner_workflow_commit=$env:GITHUB_SHA"
            "runner_workflow_branch=$env:GITHUB_REF_NAME"
            'windows_offline_qt_tests=passed'
            'public_synthetic_adc_and_byte_tach_bin_tsxml_reopen_core_and_qt_tests=passed'
            'saved_mode1_scale_timeline_axis_and_export_tests=passed'
            'prerelease_audit_regression_tests=passed'
            'operator_acceptance_regression_tests=passed'
            'native_go_tests_and_vet=passed'
            'packaged_startup_offscreen_and_native_payload_sha256=passed'
            'packaged_offline_fir_sha256_selfcheck=passed'
            'hardware_acceptance=not_performed'
          ) | Set-Content -Encoding ascii -LiteralPath (Join-Path $path 'BUILD_INFO.txt')
      - name: Upload unofficial short-lived Windows candidate
        uses: actions/upload-artifact@v6
        with:
          name: MVKView_Stage111_UNOFFICIAL_WINDOWS_FIR_SEEK_CANDIDATE_portable
          path: candidate-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove staged private inputs
        if: always()
        run: |
          $fir = Join-Path $env:RUNNER_TEMP 'offline_fir.bin'
          Remove-Item -LiteralPath $fir -Force -ErrorAction SilentlyContinue
