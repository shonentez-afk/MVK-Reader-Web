name: MVK Live Standalone - units and Qt smoke

on:
  push:
    branches:
      - feature/mvk-live-standalone-20261117
    paths:
      - 'mvk_live_standalone/**'
      - 'tools/research/native_tcp10230_stage108_live_recording_r6_1/source/**'
      - '.github/workflows/mvk_live_standalone.yml'
  workflow_dispatch:

jobs:
  live-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pytest
      - name: Verify acceleration, velocity, displacement and scale contracts
        run: python -m pytest -q mvk_live_standalone/tests/test_spectrum.py
  live-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install GUI dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pytest PySide6==6.11.2 pyqtgraph==0.14.0
      - name: Qt offscreen and physical spectrum unit smoke
        # Qt/PySide6 objects belong to their native process. Reusing the
        # same Python interpreter for dozens of distinct QMainWindows can
        # trigger shiboken none_dealloc during delayed QObject GC, even
        # when all individual GUI tests pass. Isolate test MODULES, not
        # assertions; never hide or skip failures.
        shell: bash
        run: |
          set -euo pipefail
          for test_file in mvk_live_standalone/tests/test_*.py; do
            echo "::group::Qt regression: $test_file"
            if [[ "$test_file" == "mvk_live_standalone/tests/test_qt_measurement_history.py" ]]; then
              # PySide6/shiboken 6.12 can abort at interpreter finalization
              # after repeated Qt windows + pyqtgraph overlays in ONE module
              # process (none_dealloc), despite passing all assertions.
              # Execute EVERY collected test in its own process; keep genuine
              # assertion and crash failures fatal; never skip a case.
              mapfile -t cases < <(python -m pytest --collect-only -q "$test_file" |
                  grep "^$test_file::")
              test "${#cases[@]}" -ge 1
              for case_id in "${cases[@]}"; do
                python -X faulthandler -m pytest -q "$case_id"
              done
            else
              python -X faulthandler -m pytest -q "$test_file"
            fi
            echo "::endgroup::"
          done


      - name: Capture actual modern Qt screenshots for operator review (NO DEVICE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui_review
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ["QT_QPA_PLATFORM"] = "offscreen"
          from PySide6 import QtWidgets
          from mvk_live_standalone.app import LiveWindow
          from mvk_live_standalone.modern_shell import apply_theme

          app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          app.setQuitOnLastWindowClosed(False)
          win = LiveWindow()
          # This is only a visual screenshot of an OFFLINE application.
          # No test waveform is introduced and no TCP connection is started.
          win.resize(1600, 900)
          win.show()
          app.processEvents()
          assert win._native.state() == win._native.ProcessState.NotRunning
          assert win._capture_root is None
          assert win.views.count() == 4
          for mode in ("light", "dark"):
              apply_theme(win, mode)
              app.processEvents()
              shot = win.grab()
              assert not shot.isNull(), mode
              target = Path("ui_review") / f"MVK_Live_main_{mode}_NO_DEVICE.png"
              assert shot.save(str(target), "PNG"), target
              print(f"UI preview: {target}, {shot.width()}x{shot.height()}")
          win.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MVK_Live_Modern_Main_UI_Review_NO_DEVICE
          path: ui_review/MVK_Live_main_*_NO_DEVICE.png
          retention-days: 14
          if-no-files-found: error

  live-go-ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verified R6.1 receiver + IPC integration and race detector
        run: go test -race -count=1 ./...
