# MVKView Compatible Stage111: standalone Windows desktop, NO web or device.
# Private original EXE/IDP/PAS/DFM, measurement BIN/RAW/PCAPNG and
# operator reference screenshots must NEVER enter GitHub/CI.
# The synthetic Qt preview PNGs below are generated inside CI from
# deterministic fake test fixtures; no user-owned source bytes are uploaded.
# Manual dispatch: choose research/stage111-mvkview-desktop-20261029,
# NOT the default main branch. Push builds run on the research branch only.
name: MVKView Compatible - Windows EXE

on:
  push:
    branches:
      - research/stage111-mvkview-desktop-20261029
    paths:
      - 'mvk_compatible/**'
      - 'tools/research/native_tcp10230_stage108_live_recording_r6_1/**'
      - '.github/workflows/stage111-desktop-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage111-native-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  linux-core:
    name: Linux - all offline core tests
    if: github.ref == 'refs/heads/research/stage111-mvkview-desktop-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only the selected source revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install core-only requirements
        run: python -m pip install -r mvk_compatible/requirements-core.txt pytest
      - name: Compile-check Python source files
        run: python -m compileall -q mvk_compatible
      - name: Test all offline core features (no hardware, web or Qt)
        run: |
          python -m pytest -q mvk_compatible/tests \
            --ignore=mvk_compatible/tests/test_desktop_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z25_native_recorder_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z26b_live_qt.py \
            --junitxml=linux-core-junit.xml

  desktop-windows:
    name: Windows - offline core and Qt smoke tests
    if: github.ref == 'refs/heads/research/stage111-mvkview-desktop-20261029'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout selected research revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Qt, numerical requirements and pytest
        run: |
          python -m pip install -r mvk_compatible/requirements-desktop.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile-check Python source files
        run: |
          python -m compileall -q mvk_compatible
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test all offline core features on Windows
        run: |
          python -m pytest -q mvk_compatible/tests --ignore=mvk_compatible/tests/test_desktop_qt.py --ignore=mvk_compatible/tests/test_stage111z25_native_recorder_qt.py --ignore=mvk_compatible/tests/test_stage111z26b_live_qt.py --junitxml=windows-core-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native Windows Qt GUI without connected devices
        run: |
          python -m pytest -q mvk_compatible/tests/test_desktop_qt.py mvk_compatible/tests/test_stage111z25_native_recorder_qt.py mvk_compatible/tests/test_stage111z26b_live_qt.py --junitxml=windows-qt-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test original-reference Qt, TQGrapher 10x10 grid and cursor at 150 percent DPI
        env:
          QT_SCALE_FACTOR: '1.5'
          MVK_SYNTHETIC_UI_PREVIEW_DIR: 'qa_stage111bj_preview'
        run: |
          python -c "from PySide6.QtWidgets import QApplication,QWidget; app=QApplication([]); widget=QWidget(); dpr=widget.devicePixelRatioF(); print('Qt effective DPR =', dpr); assert abs(dpr-1.5)<0.01, 'Qt ignored explicit 150% scale'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q mvk_compatible/tests/test_stage111z31a_qt_original_reference.py mvk_compatible/tests/test_stage111z31e_qt_tqgrapher_grid.py mvk_compatible/tests/test_stage111z31f_qt_tco2draw_grid.py mvk_compatible/tests/test_stage111z31g_qt_tco2draw_raster.py mvk_compatible/tests/test_stage111z31h_qt_tqgr_series.py mvk_compatible/tests/test_stage111z31i_qt_composite.py mvk_compatible/tests/test_stage111z31j_qt_textout.py mvk_compatible/tests/test_stage111z31m_qt_win32_gdi.py mvk_compatible/tests/test_stage111z31n_qt_archive_graph.py mvk_compatible/tests/test_stage111z31ax_qt_pan_cursor.py mvk_compatible/tests/test_stage111z31ay_qt_bitmap_cursor.py mvk_compatible/tests/test_stage111z31az_qt_pixel_audit.py mvk_compatible/tests/test_stage111z31bb_qt_source_state_and_axis.py mvk_compatible/tests/test_stage111z31bc_qt_crossscreen_flow.py mvk_compatible/tests/test_stage111z31bd_qt_config_and_editor.py mvk_compatible/tests/test_stage111z31bg_qt_windowman_form.py mvk_compatible/tests/test_stage111z31bh_qt_local_validation.py mvk_compatible/tests/test_stage111z31bj_qt_visible_file_workbench.py mvk_compatible/tests/test_stage111z31bk_qt_linked_time_signal_spectrum.py --junitxml=windows-qt-dpi150-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish visual QA of the WORKING Qt screens (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MVKViewCompatible_Stage111BK_Synthetic_UI_DPI150
          path: qa_stage111bj_preview/*.png
          if-no-files-found: warn
          retention-days: 7

  windows-exe-preview:
    name: Windows - verified autonomous EXE artifact
    needs:
      - linux-core
      - desktop-windows
    if: github.ref == 'refs/heads/research/stage111-mvkview-desktop-20261029'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout EXACT tested research revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install native runtime and PyInstaller
        run: |
          python -m pip install -r mvk_compatible/requirements-desktop.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Go toolchain for embedded Native R6.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - name: Test and compile the existing Native R6.1 receiver from source
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location tools/research/native_tcp10230_stage108_live_recording_r6_1/source
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go vet ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $payload = Join-Path $env:GITHUB_WORKSPACE 'mvk_compatible/native_payload'
            New-Item -ItemType Directory -Force -Path $payload | Out-Null
            $nativeExe = Join-Path $payload 'MVK_Native_R6_1_Stage108_Windows_x64.exe'
            go build -trimpath -ldflags '-s -w' -o $nativeExe .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $hash = (Get-FileHash -LiteralPath $nativeExe -Algorithm SHA256).Hash.ToLowerInvariant()
            $hash | Set-Content -Encoding ascii -Path (Join-Path $payload 'NATIVE_SHA256SUMS.txt')
          } finally {
            Pop-Location
          }
      - name: Build one-file standalone Windows EXE with embedded Go recorder
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --add-binary "mvk_compatible/native_payload/MVK_Native_R6_1_Stage108_Windows_x64.exe;mvk_native" --add-data "mvk_compatible/native_payload/NATIVE_SHA256SUMS.txt;mvk_native" --name MVKViewCompatible_Stage111_PREVIEW mvk_compatible/windows_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath dist/MVKViewCompatible_Stage111_PREVIEW.exe)) {
            throw 'PyInstaller did not create the Windows EXE'
          }
      - name: Write exact commit and artifact SHA256
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'dist/MVKViewCompatible_Stage111_PREVIEW.exe'
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MVKViewCompatible_Stage111_PREVIEW.exe" | Set-Content -Encoding ascii -Path dist/SHA256SUMS.txt
          @("commit=$env:GITHUB_SHA", "branch=$env:GITHUB_REF_NAME") | Set-Content -Encoding ascii -Path dist/BUILD_INFO.txt
          python -m mvk_compatible.verify_windows_preview_artifact --dist dist --expected-commit $env:GITHUB_SHA --expected-branch $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish only a separately reverified copy
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path verified-dist -ErrorAction Stop | Out-Null
          foreach ($name in @('MVKViewCompatible_Stage111_PREVIEW.exe', 'SHA256SUMS.txt', 'BUILD_INFO.txt')) {
            Copy-Item -LiteralPath (Join-Path dist $name) -Destination (Join-Path verified-dist $name) -ErrorAction Stop
          }
          python -m mvk_compatible.verify_windows_preview_artifact --dist verified-dist --expected-commit $env:GITHUB_SHA --expected-branch $env:GITHUB_REF_NAME --receipt-json verified-dist/BUILD_VERIFICATION.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath verified-dist/BUILD_VERIFICATION.json)) {
            throw 'Verified Windows artifact receipt is missing'
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### MVKView Compatible - verified Windows EXE'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Source branch: $env:GITHUB_REF_NAME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Source commit: $env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Artifact: MVKViewCompatible_Stage111_Windows_Preview'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Contents: one-file GUI EXE with embedded Go Native R6.1 (built and tested from repo), SHA256SUMS.txt, BUILD_INFO.txt, BUILD_VERIFICATION.json'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- This preview is NOT certified as an exact clone of original MVKView.'
      - name: Upload verified Windows EXE and checksums
        uses: actions/upload-artifact@v6
        with:
          name: MVKViewCompatible_Stage111_Windows_Preview
          path: verified-dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
