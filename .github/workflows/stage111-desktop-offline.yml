name: Stage111 native desktop OFFLINE
on:
  push:
    branches:
      - research/stage111-mvkview-desktop-20261029
    paths:
      - 'mvk_compatible/**'
      - '.github/workflows/stage111-desktop-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy and pytest (no Qt, HTTP or instruments)
        run: python -m pip install -r mvk_compatible/requirements-core.txt pytest
      - name: Verify Python syntax
        run: python -m compileall -q mvk_compatible
      - name: Verify offline DSP and archive
        run: python -m pytest -q mvk_compatible/tests/test_offline_core.py mvk_compatible/tests/test_fft_idr_candidate.py mvk_compatible/tests/test_signal_idr_candidate.py
  desktop-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Qt runtime
        run: python -m pip install -r mvk_compatible/requirements-desktop.txt pytest
      - name: Verify native Qt tabs in separate process
        run: python -m pytest -q mvk_compatible/tests/test_desktop_qt.py
      - name: Verify measurement and reconstructed FFT on Windows
        run: python -m pytest -q mvk_compatible/tests/test_offline_core.py mvk_compatible/tests/test_fft_idr_candidate.py mvk_compatible/tests/test_signal_idr_candidate.py
  windows-exe-preview:
    needs: desktop-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native runtime and PyInstaller
        run: python -m pip install -r mvk_compatible/requirements-desktop.txt pyinstaller
      - name: Build Windows desktop preview (NO server / device)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --name MVKViewCompatible_Stage111_PREVIEW mvk_compatible/windows_launcher.py
      - name: Record executable SHA-256
        shell: pwsh
        run: |
          $f='dist/MVKViewCompatible_Stage111_PREVIEW.exe'
          $hash=(Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MVKViewCompatible_Stage111_PREVIEW.exe" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: MVKViewCompatible_Stage111_Windows_Preview
          path: |
            dist/MVKViewCompatible_Stage111_PREVIEW.exe
            dist/SHA256SUMS.txt
          retention-days: 14
