name: Stage111 EE FRange and TACH integration
on:
  push:
    branches: [research/stage111-ee-frange-numerical-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - run: go test -v -count=1 -run 'TestSourceMetadataNumerical|TestSourceTachLatchCoreFixture|TestSourceMetadataSocketBoundary|TestValuesTriggerPrefix|TestOriginalMode2EmptyPARAM' .
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath .
  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate actual Go V1 and V2 writer receipts
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
        run: |
          export MVK_TACH_LATCH_FIXTURE_DIR="$RUNNER_TEMP/mvk-latch-fixture"
          export MVK_PREFIX_FIXTURE_DIR="$RUNNER_TEMP/mvk-prefix-fixture"
          export MVK_RANGE_FIXTURE_DIR="$RUNNER_TEMP/mvk-range-fixture"
          mkdir -p "$MVK_TACH_LATCH_FIXTURE_DIR" "$MVK_PREFIX_FIXTURE_DIR" "$MVK_RANGE_FIXTURE_DIR"
          echo "MVK_RANGE_FIXTURE_DIR=$MVK_RANGE_FIXTURE_DIR" >> "$GITHUB_ENV"
          echo "MVK_TACH_LATCH_FIXTURE_DIR=$MVK_TACH_LATCH_FIXTURE_DIR" >> "$GITHUB_ENV"
          echo "MVK_PREFIX_FIXTURE_DIR=$MVK_PREFIX_FIXTURE_DIR" >> "$GITHUB_ENV"
          go test -v -count=1 -run '^(TestSourceMetadataNumericalCoreFixture|TestSourceTachLatchCoreFixture|TestValuesTriggerPrefixCoreFixture)$' .
      - run: python -m pip install -r mvk_compatible/requirements-core.txt pytest
      - name: Verify old and new RAW replay and reject rehashed latch errors
        run: python -m pytest -q mvk_compatible/tests/test_stage111_ee_frange_numerical_integration.py mvk_compatible/tests/test_stage111_ee_tach_latch_integration.py mvk_compatible/tests/test_mode2_live_values_trigger_prefix.py mvk_compatible/tests/test_original_source_values_tick_acceptance.py mvk_compatible/tests/test_stage111z31fq_original_values_3100_timeline.py mvk_compatible/tests/test_stage111z31fq_marked_values_export.py
      - name: Full offline core regression
        run: python -m pytest -q mvk_compatible/tests --ignore=mvk_compatible/tests/test_desktop_qt.py --ignore=mvk_compatible/tests/test_stage111z25_native_recorder_qt.py --ignore=mvk_compatible/tests/test_stage111z26b_live_qt.py
