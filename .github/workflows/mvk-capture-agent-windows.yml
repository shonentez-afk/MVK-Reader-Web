name: MVK Capture Agent - Windows standalone QA
on:
  push:
    branches:
      - 'feature/mvk-capture-agent-v1-20261116'
      - 'feature/mvk-capture-agent-v2-20261116'
    paths:
      - 'tools/mvk_capture_agent/**'
      - '.github/workflows/mvk-capture-agent-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests
        working-directory: tools/mvk_capture_agent
        run: python -m unittest discover -v -s tests -p 'test_*.py'
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build prerequisites
        working-directory: tools/mvk_capture_agent
        run: python -m pip install pillow frida pyinstaller
      - name: Offline tests (no original MVKView)
        working-directory: tools/mvk_capture_agent
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Build GUI and MCP single-file executables
        working-directory: tools/mvk_capture_agent
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --collect-all frida --add-data "capture_agent/frida_trace.js:capture_agent" --name MVKCaptureAgent app_gui.py
          python -m PyInstaller --noconfirm --clean --onefile --console --collect-all frida --add-data "capture_agent/frida_trace.js:capture_agent" --name MVKCaptureMCP app_mcp.py
      - uses: actions/upload-artifact@v4
        with:
          name: MVK-Capture-Agent-Windows-v0.2
          path: |
            tools/mvk_capture_agent/dist/MVKCaptureAgent.exe
            tools/mvk_capture_agent/dist/MVKCaptureMCP.exe
          if-no-files-found: error
          retention-days: 14