name: Stage111 - VALUES trigger-prefix regression
on:
  push:
    branches: [fix/stage111-values-trigger-prefix-20261124, fix/stage111-eg-computation-links-20261124, research/stage111-mvkview-desktop-20261029]
    paths:
      - 'tools/research/native_tcp10230_stage108_live_recording_r6_1/**'
      - 'mvk_compatible/**'
      - '.github/workflows/stage111-values-trigger-prefix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Strict trigger-prefix, Freeze, duplicate, Stop regressions
        run: go test -v -count=1 -run 'TestValuesTriggerPrefix|TestSourceLocalTach|TestOriginalQtStopFileEndsSameSocketAndClosesWriteDataWriteValues|TestOriginalWriteValuesStopClosesActiveOnlyWhenClean' .
      - name: Complete Native Go regression
        run: go test -count=1 ./...
      - name: Vet Native Go
        run: go vet ./...
      - name: Compile Native receiver (offline)
        run: go build -trimpath .

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set isolated fixture location
        run: echo "MVK_PREFIX_FIXTURE_DIR=$RUNNER_TEMP/mvk-prefix-fixture" >> "$GITHUB_ENV"
      - name: Generate actual Go writer evidence from synthetic frames
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
        run: |
          mkdir -p "$MVK_PREFIX_FIXTURE_DIR"
          go test -v -count=1 -run '^(TestValuesTriggerPrefixCoreFixture|TestSourceLocalTachCoreFixture) .
      - name: Install offline core test requirements
        run: python -m pip install -r mvk_compatible/requirements-core.txt pytest
      - name: Verify actual Go RAW prefix and reject rehashed suffix
        run: |
          python -m pytest -q mvk_compatible/tests/test_mode2_live_values_trigger_prefix.py \
            mvk_compatible/tests/test_mode2_live_values_full_chain.py \
            mvk_compatible/tests/test_stage111z31ei_local_tach.py \
            mvk_compatible/tests/test_original_source_values_tick_acceptance.py \
            mvk_compatible/tests/test_stage111z31fq_original_values_3100_timeline.py \
            mvk_compatible/tests/test_stage111z31fq_marked_values_export.py
      - name: Complete offline core regressions (no Qt or device)
        run: |
          python -m pytest -q mvk_compatible/tests \
            --ignore=mvk_compatible/tests/test_desktop_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z25_native_recorder_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z26b_live_qt.py
 .
      - name: Install offline core test requirements
        run: python -m pip install -r mvk_compatible/requirements-core.txt pytest
      - name: Verify actual Go RAW prefix and reject rehashed suffix
        run: |
          python -m pytest -q mvk_compatible/tests/test_mode2_live_values_trigger_prefix.py \
            mvk_compatible/tests/test_mode2_live_values_full_chain.py \
            mvk_compatible/tests/test_original_source_values_tick_acceptance.py \
            mvk_compatible/tests/test_stage111z31fq_original_values_3100_timeline.py \
            mvk_compatible/tests/test_stage111z31fq_marked_values_export.py
      - name: Complete offline core regressions (no Qt or device)
        run: |
          python -m pytest -q mvk_compatible/tests \
            --ignore=mvk_compatible/tests/test_desktop_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z25_native_recorder_qt.py \
            --ignore=mvk_compatible/tests/test_stage111z26b_live_qt.py
