name: Stage111 - VALUES trigger-prefix regression
on:
  push:
    branches: [fix/stage111-values-trigger-prefix-20261124]
    paths:
      - 'tools/research/native_tcp10230_stage108_live_recording_r6_1/**'
      - '.github/workflows/stage111-values-trigger-prefix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/research/native_tcp10230_stage108_live_recording_r6_1/source
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Strict trigger-prefix, Freeze, duplicate, Stop regressions
        run: go test -v -count=1 -run 'TestValuesTriggerPrefix|TestOriginalQtStopFileEndsSameSocketAndClosesWriteDataWriteValues|TestOriginalWriteValuesStopClosesActiveOnlyWhenClean' .
      - name: Complete Native Go regression
        run: go test -count=1 ./...
      - name: Vet Native Go
        run: go vet ./...
      - name: Compile Native receiver (offline)
        run: go build -trimpath .
